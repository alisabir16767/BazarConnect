version: "3.8"

services:
  backend:
    build: ./backend
    container_name: backend_app
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    container_name: frontend_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
